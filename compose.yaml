name: storyboard-tool

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      PORT: 3001
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
    volumes:
      - storyboard_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  storyboard_data:
